# Alembic configuration for derived Mahindra AI state.
#
# This migration lineage is intentionally independent from the validated
# Synthetic Data Factory runtime schema.
#
# Runtime/public:
#   backend/alembic.ini
#   public.alembic_version
#
# Derived AI state:
#   backend/alembic_ai_state.ini
#   ai_state.alembic_version

[alembic]
script_location = alembic_ai_state
prepend_sys_path = .
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
timezone = UTC
version_path_separator = os

# Overridden at runtime by alembic_ai_state/env.py.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
