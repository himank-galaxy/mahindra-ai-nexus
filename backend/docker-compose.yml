# Local development stack: PostgreSQL + FastAPI backend.
# Usage: docker compose up --build
services:
  postgres:
    image: postgres:16-alpine
    container_name: mahindra-postgres
    environment:
      POSTGRES_USER: mahindra
      POSTGRES_PASSWORD: mahindra
      POSTGRES_DB: mahindra_ai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mahindra -d mahindra_ai"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: mahindra-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://mahindra:mahindra@postgres:5432/mahindra_ai
      ENVIRONMENT: development
      DEBUG: "true"
      LOG_LEVEL: INFO
      CORS_ORIGINS: http://10.10.90.98:5174,http://localhost:5174,http://localhost:5173,http://localhost:3000
      AI_PROVIDER: rule
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"

volumes:
  pgdata:
