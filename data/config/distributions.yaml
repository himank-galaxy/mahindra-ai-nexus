# ============================================================
# MANUFACTURING CAUSAL GENERATION
#
# IMPORTANT:
# THIS SECTION IS FOR SYNTHETIC GENERATION ONLY.
#
# Runtime PCMCI must NEVER read these relationships.
# ============================================================

  causal_generation:

    machine_temperature:
      autoregressive:
        lag: 1
        coefficient: 0.65

      parents:
        machine_load:
          lag: 1
          coefficient: 0.20

    machine_vibration:
      autoregressive:
        lag: 1
        coefficient: 0.65

      parents:
        machine_temperature:
          lag: 1
          coefficient: 0.25

        machine_load:
          lag: 1
          coefficient: 0.15

      noise_std: 0.18

    power_consumption:
      autoregressive:
        lag: 1
        coefficient: 0.40

      parents:
        machine_load:
          lag: 0
          coefficient: 0.45

        line_speed:
          lag: 0
          coefficient: 0.20

      noise_std: 0.15

    paint_booth_humidity:
      autoregressive:
        lag: 1
        coefficient: 0.55

      parents:
        ambient_humidity:
          lag: 1
          coefficient: 0.35

      noise_std: 0.15

    paint_defect_rate:
      autoregressive:
        lag: 1
        coefficient: 0.35

      parents:
        paint_booth_humidity:
          lag: 1
          coefficient: 0.35

        line_speed:
          lag: 1
          coefficient: 0.20

        supplier_lot_quality:
          lag: 1
          coefficient: -0.20

      noise_std: 0.18

    defect_rate:
      autoregressive:
        lag: 1
        coefficient: 0.40

      parents:
        supplier_lot_quality:
          lag: 1
          coefficient: -0.30

        torque_deviation:
          lag: 1
          coefficient: 0.18

        line_speed:
          lag: 1
          coefficient: 0.15

      noise_std: 0.20

    rework_rate:
      autoregressive:
        lag: 1
        coefficient: 0.45

      parents:
        defect_rate:
          lag: 1
          coefficient: 0.40

        paint_defect_rate:
          lag: 1
          coefficient: 0.25

      noise_std: 0.18

    equipment_downtime:
      parents:
        machine_vibration:
          lag: 2
          coefficient: 0.30

        machine_temperature:
          lag: 1
          coefficient: 0.20

        maintenance_event:
          lag: 1
          coefficient: -0.25

      noise_std: 0.20

    quality_score:
      autoregressive:
        lag: 1
        coefficient: 0.50

      parents:
        defect_rate:
          lag: 1
          coefficient: -0.35

        rework_rate:
          lag: 1
          coefficient: -0.20

        torque_deviation:
          lag: 1
          coefficient: -0.10

      noise_std: 0.15

# ============================================================
# MANUFACTURING EVENTS
# ============================================================

  events:

    maintenance_event_probability_per_hour: 0.003

    baseline_downtime_probability_per_hour: 0.008

