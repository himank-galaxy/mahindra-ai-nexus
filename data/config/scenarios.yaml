  credit_demand_spike:
    enabled: true
    weight: 0.7

    parameters:
      buyer_demand_multiplier:
        min: 1.25
        max: 2.00

  low_traceability:
    enabled: true
    weight: 0.5

    parameters:
      traceability_score:
        min: 0.30
        max: 0.60

