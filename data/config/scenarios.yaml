# COLLECTIONS SCENARIOS
# ============================================================

collections:

  digital_recovery_success:
    enabled: true
    weight: 0.8

    parameters:
      digital_response_probability:
        min: 0.60
        max: 0.85

      payment_after_contact_probability:
        min: 0.45
        max: 0.75

  field_visit_required:
    enabled: true
    weight: 0.6

    parameters:
      digital_response_probability:
        min: 0.05
        max: 0.25

      field_visit_success_probability:
        min: 0.45
        max: 0.70

  restructuring_candidate:
    enabled: true
    weight: 0.6

    parameters:
      restructuring_acceptance_probability:
        min: 0.45
        max: 0.75

# ============================================================
# LOGISTICS SCENARIOS
# ============================================================

logistics:

  weather_disruption:
    enabled: true
    weight: 1.0

    duration_hours:
      min: 4
      max: 36

    parameters:
      transit_time_multiplier:
        min: 1.15
        max: 1.60

  port_congestion:
    enabled: true
    weight: 0.8

    duration_hours:
      min: 12
      max: 72

    parameters:
      dwell_time_hours:
        min: 3
        max: 24

  warehouse_bottleneck:
    enabled: true
    weight: 1.0

    duration_hours:
      min: 6
      max: 48

    parameters:
      dock_occupancy_delta:
        min: 0.15
        max: 0.40

      picking_backlog_multiplier:
        min: 1.30
        max: 2.50

  vehicle_shortage:
    enabled: true
    weight: 0.7

    duration_hours:
      min: 6
      max: 48

    parameters:
      vehicle_availability_multiplier:
        min: 0.50
        max: 0.80

  route_closure:
    enabled: true
    weight: 0.3

    duration_hours:
      min: 2
      max: 18

    parameters:
      reroute_required: true

