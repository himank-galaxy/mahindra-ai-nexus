# ============================================================
# Mahindra AI Nexus
# Synthetic Scenario Engine Configuration
# ============================================================

scenario_version: "1.0.0"

enabled: true

# ------------------------------------------------------------
# GLOBAL SCENARIO MIX
# ------------------------------------------------------------

scenario_distribution:

  baseline:
    weight: 0.40

  moderate_variation:
    weight: 0.20

  performance_deterioration:
    weight: 0.15

  anomaly:
    weight: 0.10

  severe_event:
    weight: 0.05

  compliance_review:
    weight: 0.05

  recovery_improvement:
    weight: 0.05

# ============================================================
# AUTO / DEALER SCENARIOS
# ============================================================

auto:

  dealer_followup_degradation:
    enabled: true
    weight: 1.0

    duration_days:
      min: 5
      max: 20

    parameters:
      followup_completion_multiplier:
        min: 0.55
        max: 0.80

      stale_lead_multiplier:
        min: 1.20
        max: 1.80

      test_drive_completion_lag_days: 2

      booking_conversion_lag_days: 4

  test_drive_no_show_spike:
    enabled: true
    weight: 0.8

    duration_days:
      min: 3
      max: 10

    parameters:
      no_show_multiplier:
        min: 1.30
        max: 2.00

  finance_approval_slowdown:
    enabled: true
    weight: 1.0

    duration_days:
      min: 7
      max: 30

    parameters:
      approval_tat_multiplier:
        min: 1.40
        max: 2.50

      approval_rate_delta:
        min: -0.15
        max: -0.05

      cancellation_lag_days:
        min: 2
        max: 7

  allocation_shortage:
    enabled: true
    weight: 0.8

    duration_days:
      min: 5
      max: 25

    parameters:
      allocation_fill_multiplier:
        min: 0.55
        max: 0.80

      waiting_list_multiplier:
        min: 1.20
        max: 1.80

  competitor_promo_shock:
    enabled: true
    weight: 0.6

    duration_days:
      min: 7
      max: 21

    parameters:
      booking_conversion_delta:
        min: -0.08
        max: -0.02

      cancellation_delta:
        min: 0.01
        max: 0.05

# ============================================================
# MANUFACTURING / QUALITY SCENARIOS
# ============================================================

manufacturing:

  paint_humidity_spike:
    enabled: true
    weight: 1.0

    duration_hours:
      min: 12
      max: 72

    parameters:
      ambient_humidity_delta:
        min: 8.0
        max: 20.0

      paint_booth_humidity_delta:
        min: 10.0
        max: 25.0

      defect_effect_lag_hours: 1

      recovery_hours:
        min: 6
        max: 24

  machine_temperature_drift:
    enabled: true
    weight: 1.0

    duration_hours:
      min: 12
      max: 96

    parameters:
      temperature_delta_c:
        min: 5.0
        max: 15.0

      vibration_effect_lag_hours: 1

  machine_vibration_anomaly:
    enabled: true
    weight: 1.0

    duration_hours:
      min: 6
      max: 48

    parameters:
      vibration_multiplier:
        min: 1.40
        max: 2.50

      downtime_effect_lag_hours:
        min: 1
        max: 3

  supplier_quality_drop:
    enabled: true
    weight: 0.9

    duration_hours:
      min: 24
      max: 120

    parameters:
      supplier_quality_delta:
        min: -0.25
        max: -0.08

      defect_effect_lag_hours:
        min: 1
        max: 4

  line_speed_pressure:
    enabled: true
    weight: 0.8

    duration_hours:
      min: 12
      max: 72

    parameters:
      line_speed_multiplier:
        min: 1.10
        max: 1.30

      rework_effect_lag_hours:
        min: 1
        max: 3

  torque_deviation:
    enabled: true
    weight: 0.7

    duration_hours:
      min: 6
      max: 48

    parameters:
      torque_deviation_multiplier:
        min: 1.50
        max: 3.00

      quality_effect_lag_hours:
        min: 1
        max: 2

  maintenance_overdue:
    enabled: true
    weight: 0.8

    duration_hours:
      min: 24
      max: 168

    parameters:
      vibration_multiplier:
        min: 1.10
        max: 1.50

      downtime_probability_multiplier:
        min: 1.25
        max: 2.00

  maintenance_recovery:
    enabled: true
    weight: 0.6

    parameters:
      vibration_reduction_multiplier:
        min: 0.55
        max: 0.80

      downtime_reduction_multiplier:
        min: 0.50
        max: 0.80

# ============================================================
# FINANCE SCENARIOS
# ============================================================

finance:

  income_stress:
    enabled: true
    weight: 1.0

    parameters:
      income_multiplier:
        min: 0.65
        max: 0.90

      missed_payment_probability_delta:
        min: 0.08
        max: 0.25

  seasonal_rural_income:
    enabled: true
    weight: 0.7

    parameters:
      income_variability_multiplier:
        min: 1.20
        max: 1.80

  early_delinquency:
    enabled: true
    weight: 0.9

    parameters:
      days_late:
        min: 5
        max: 30

